<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg-sh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7EBDE" />
      <stop offset="100%" stop-color="#D1DAC1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg-sh)" />
  
  <!-- Architectural line elements representing room interior -->
  <path d="M120 440 L680 440 M120 160 L680 160 M120 160 L120 440 M680 160 L680 440" stroke="#7A8664" stroke-width="2" opacity="0.3" stroke-dasharray="6,6" />
  
  <!-- Bed illustration -->
  <rect x="220" y="280" width="280" height="150" rx="14" fill="#F7F3EA" stroke="#7A8664" stroke-width="3" />
  <rect x="250" y="300" width="100" height="50" rx="8" fill="#D8C4A8" stroke="#7A8664" stroke-width="2" />
  <rect x="250" y="370" width="220" height="50" rx="6" fill="#E8DCCB" />
  
  <!-- Window illustration -->
  <rect x="540" y="200" width="100" height="120" rx="6" fill="#F7F3EA" stroke="#7A8664" stroke-width="2" />
  <line x1="590" y1="200" x2="590" y2="320" stroke="#7A8664" stroke-width="2" />
  <line x1="540" y1="260" x2="640" y2="260" stroke="#7A8664" stroke-width="2" />

  <!-- Centered Label Overlay -->
  <rect x="190" y="490" width="420" height="56" rx="28" fill="#30352D" opacity="0.9" />
  <text x="400" y="525" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#F7F3EA" text-anchor="middle">Foto Kamar dengan Kamar Mandi Sharing</text>
</svg>
